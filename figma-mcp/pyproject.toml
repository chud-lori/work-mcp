[project]
name = "figma-mcp"
version = "0.1.0"
description = "Read-only MCP server for Figma projects, files, and comments."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.2.0,<2",
  "python-dotenv>=1.0.0",
]

[project.scripts]
figma-mcp = "figma_mcp.server:main"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
